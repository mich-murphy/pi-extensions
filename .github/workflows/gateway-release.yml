name: Stage gateway release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/gateway-release.yml
      - packages/pi-comms/gateway/**
      - flake.nix
      - flake.lock

# Staging only: no release creation, upload to Releases, signing keys or OIDC.
permissions:
  contents: read

concurrency:
  group: gateway-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check native target and release helpers
        shell: bash
        run: |
          test "$(python3 packages/pi-comms/gateway/release/artifacts.py native-target)" = '${{ matrix.target }}'
          python3 -m unittest discover -s packages/pi-comms/gateway/release -p 'test_*.py'
      - name: Build locked native executable with pinned Rust
        shell: bash
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/gateway-target"
          channel=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("packages/pi-comms/gateway/rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal
          # Native runner linker/libc, NOT Nix's store-only runtime closure.
          cargo +"$channel" build --locked --release \
            --manifest-path packages/pi-comms/gateway/Cargo.toml --bin pi-gateway
          mkdir -p staged
          rustc +"$channel" -vV > staged/rustc.txt
          file "$CARGO_TARGET_DIR/release/pi-gateway" > staged/linkage.txt
          if [ "$(uname -s)" = Darwin ]; then
            otool -L "$CARGO_TARGET_DIR/release/pi-gateway" >> staged/linkage.txt
          else
            readelf -l -d -V "$CARGO_TARGET_DIR/release/pi-gateway" >> staged/linkage.txt
          fi
          if grep -q /nix/store/ staged/linkage.txt; then
            echo "Standalone artifact unexpectedly depends on Nix store" >&2
            exit 1
          fi
          python3 packages/pi-comms/gateway/release/artifacts.py stage \
            --binary "$CARGO_TARGET_DIR/release/pi-gateway" --output staged \
            --revision "$GITHUB_SHA" --target '${{ matrix.target }}'
          "$CARGO_TARGET_DIR/release/pi-gateway" --version --json > staged/version.json
      - name: Older glibc consumer loader smoke (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Immutable multi-platform Debian bookworm image; this is a loader/version
          # smoke, not permission to lower the declared supported/tested baseline.
          image='node@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059'
          docker pull "$image"
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit=32 --memory=128m \
            --user=65534:65534 \
            --mount "type=bind,source=$RUNNER_TEMP/gateway-target/release/pi-gateway,target=/candidate/pi-gateway,readonly" \
            "$image" sh -ec 'test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.36"; getconf GNU_LIBC_VERSION; /candidate/pi-gateway --version --json' \
            > staged/older-consumer.txt
      - name: Record staging provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          keys = ["GITHUB_REPOSITORY", "GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_WORKFLOW_REF", "RUNNER_OS", "RUNNER_ARCH"]
          pathlib.Path("staged/provenance.json").write_text(json.dumps({key: os.environ[key] for key in keys}, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-${{ matrix.target }}
          path: staged/
          if-no-files-found: error
          retention-days: 14

  catalog:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gateway-*
          path: candidates
      - name: Assemble and verify complete catalog
        shell: bash
        run: |
          mkdir release
          for target in aarch64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            cp "candidates/gateway-$target/"*.tar.gz release/
            cp "candidates/gateway-$target/$target.json" release/
          done
          python3 packages/pi-comms/gateway/release/artifacts.py assemble \
            --directory release --revision "$GITHUB_SHA"
          cp -R candidates release/build-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-release-candidate-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
