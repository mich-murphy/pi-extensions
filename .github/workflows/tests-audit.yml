name: Tests audit

# Reports the tests in the test files changed in the past week that add no detection: every code
# change that they catch, another test catches too. The report is the job summary. It never fails
# on a finding and removes nothing; a person reads each test first (CONTRIBUTING.md).
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      since:
        description: Audit the test files changed since this git date, for example "14 days ago"
        required: false
        default: "7 days ago"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Tests that add no detection
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      SINCE_INPUT: ${{ inputs.since }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Install dependencies
        run: nix develop -c npm ci
      - name: Find the test files changed this week
        run: |
          since="${SINCE_INPUT:-7 days ago}"
          git log --since="$since" --diff-filter=AM --name-only --format= HEAD -- 'packages/*/test/*.test.ts' 'packages/*/test/**/*.test.ts' \
            | sort -u | while read -r file; do [ -f "$file" ] && echo "$file"; done > changed-tests.txt
          echo "Test files changed since ${since}:"
          cat changed-tests.txt
      - name: Build the gateway for the pi-peers tests
        if: ${{ hashFiles('changed-tests.txt') != '' }}
        run: |
          if grep -q '^packages/pi-peers/' changed-tests.txt; then
            nix develop -c bash -c 'cd packages/pi-peers/gateway && cargo build --locked'
          fi
      - name: Run the kill matrix of each changed test file
        timeout-minutes: 100
        run: |
          mkdir -p .fallow/reports
          # A test file can kill mutants in its own package only; one run per package.
          for package in $(cut -d/ -f2 changed-tests.txt | sort -u); do
            targets=()
            while read -r file; do targets+=(--kill-matrix-for "$file"); done < <(grep "^packages/${package}/" changed-tests.txt)
            # The runner is a throwaway VM, so mutants near file, process and network calls run too.
            nix develop -c npx fallow mutation "packages/${package}" -c config/fallow-mutation.jsonc \
              "${targets[@]}" --allow-side-effects --concurrency 2 --time-budget 20m \
              --format json --quiet --output-file ".fallow/reports/${package}.json" \
              || echo "::warning::fallow mutation for ${package} exited $?"
          done
      - name: Write the job summary
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          nix develop -c node --experimental-strip-types scripts/tests-audit.ts .fallow/reports/*.json >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-audit-${{ github.run_id }}
          path: .fallow/reports/
          if-no-files-found: ignore
          retention-days: 30
