name: Renovate
on:
  workflow_dispatch:
    inputs:
      overrideSchedule:
        description: "Override all schedules"
        required: false
        default: false
        type: boolean
  # Offset from the home-infra run so the two self-hosted bots do not spend the
  # same token's API budget at the same time.
  schedule:
    - cron: "30 5,7 * * *"
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Renovate
        uses: renovatebot/github-action@9fea9f0fbf80401026d11d03911d62b1f70fef1f # v46.3.3
        env:
          RENOVATE_FORCE: ${{ inputs.overrideSchedule == true && '{''schedule'':null}' || '' }}
        with:
          configurationFile: .github/renovate-config.json
          token: ${{ secrets.RENOVATE_TOKEN }}
