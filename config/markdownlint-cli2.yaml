ignores:
  - "**/node_modules/**"
config:
  line-length: false
  first-line-heading: false
  ol-prefix:
    style: ordered
  single-title: false
  no-inline-html:
    allowed_elements:
      - important
      - issue-template
      - local-ticket-template
      - spec-template
      - user-story-example
      - vertical-slice-rules
      - actor
      - benefit
      - changing
      - feature
      - NN
      - Ticket
      - X
